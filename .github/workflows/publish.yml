name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to recover
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve release identity
        id: release_identity
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"; then
            echo "release tag does not exist: $REQUESTED_TAG" >&2
            exit 1
          fi
          release_sha="$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$release_sha" ]]; then
            echo "checkout does not match release tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare npm Trusted Publishing
        run: |
          npm install --global npm@11.5.1
          node --version
          npm --version

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ steps.release_identity.outputs.tag }}
          RELEASE_SHA: ${{ steps.release_identity.outputs.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            env -u GITHUB_REF_NAME -u GITHUB_REF_TYPE GITHUB_SHA="$RELEASE_SHA" npm run release:check
          else
            npm run release:check
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare isolated test state
        shell: bash
        run: |
          agent_dir="$RUNNER_TEMP/pi-agent"
          cache_dir="$agent_dir/pi-provider"
          mkdir -p "$cache_dir"
          node -e 'const fs = require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ version: 3, sourceUrl: "https://openrouter.ai/api/v1/models", updatedAt: Date.now(), snapshot: {} }) + "\n")' "$cache_dir/openrouter-model-metadata.json"
          echo "PI_CODING_AGENT_DIR=$agent_dir" >> "$GITHUB_ENV"

      - name: Run verification gate
        run: |
          npm run audit:runtime
          npm run audit:all
          npm run check
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            npm test -- --test-concurrency=1
          else
            npm test
          fi
          npm run artifact:check

      - name: Pack tarball
        run: npm pack

      - name: Create release checksum
        run: sha256sum ./*.tgz > SHA256SUMS

      - name: Check npm registry version
        id: registry_version
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release_identity.outputs.sha }}
        run: |
          set -euo pipefail
          package_name="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).name')"
          package_version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          package_spec="${package_name}@${package_version}"
          if npm view "$package_spec" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            git_head="$(npm view "$package_spec" gitHead --registry=https://registry.npmjs.org --json)"
            git_head="${git_head//\"/}"
            if [ "$git_head" != "${RELEASE_SHA}" ]; then
              echo "${package_spec} already exists with gitHead ${git_head}; expected ${RELEASE_SHA}" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${package_spec} is already published from this release commit; skipping duplicate publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm via Trusted Publishing
        if: steps.registry_version.outputs.published != 'true'
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            npm publish --access public --ignore-scripts
          else
            npm publish --access public
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-assets
          path: |
            ./*.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-assets
          path: release-assets

      - name: Prepare release notes
        run: npm run release:notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*.tgz
            release-assets/SHA256SUMS
          generate_release_notes: false
